name: Release desktop app

on:
  push:
    branches: ["main"]
    paths:
      - "apps/desktop/src-tauri/tauri.conf.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect version change
        id: version
        shell: bash
        run: |
          current="$(jq -r '.version' apps/desktop/src-tauri/tauri.conf.json)"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            previous="$(git show "${{ github.event.before }}:apps/desktop/src-tauri/tauri.conf.json" 2>/dev/null | jq -r '.version' 2>/dev/null || true)"
            if [[ "$current" == "$previous" ]]; then
              echo "tauri.conf.json changed but its version did not; nothing to release."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "tag=v$current" >> "$GITHUB_OUTPUT"
          echo "version=$current" >> "$GITHUB_OUTPUT"

      - name: Create draft release and tag
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" != "true" ]]; then
              echo "Release $TAG is already published. Bump the version in tauri.conf.json." >&2
              exit 1
            fi
            echo "Reusing draft release $TAG."
            exit 0
          fi
          gh release create "$TAG" \
            --draft \
            --generate-notes \
            --target "${{ github.sha }}" \
            --title "Güneş Mail v$VERSION"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-26
            args: --target aarch64-apple-darwin
            targets: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-26-intel
            args: --target x86_64-apple-darwin
            targets: x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            args: ""
            targets: ""
          - name: Linux
            os: ubuntu-22.04
            args: ""
            targets: ""
    runs-on: ${{ matrix.os }}
    # Holds the Developer ID certificate and the App Store Connect key used for notarization.
    environment: desktop-release
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
      GUNES_MAIL_API_URL: ${{ vars.GUNES_MAIL_API_URL || 'https://gunes-mail-api.denizlg24.com' }}
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Tauri signs and notarizes when these variables exist and refuses an empty
      # APPLE_CERTIFICATE rather than skipping it, so they are exported only when every
      # secret is present. Without them the build is signed ad hoc, which Gatekeeper
      # reports as "damaged" once the download is quarantined.
      - name: Prepare macOS signing
        id: macos-signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          DEVELOPER_ID_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_IDENTITY }}
          APPLE_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          APPLE_ASC_PRIVATE_KEY: ${{ secrets.APPLE_ASC_PRIVATE_KEY }}
        run: |
          missing=()
          for name in DEVELOPER_ID_P12 DEVELOPER_ID_P12_PASSWORD DEVELOPER_ID_IDENTITY \
            APPLE_ASC_KEY_ID APPLE_ASC_ISSUER_ID APPLE_ASC_PRIVATE_KEY; do
            [[ -z "${!name}" ]] && missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::warning::Developer ID signing is not set up (missing: ${missing[*]}). Signing ad hoc."
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          key_path="$RUNNER_TEMP/AuthKey_$APPLE_ASC_KEY_ID.p8"
          printf '%s\n' "$APPLE_ASC_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          {
            echo "APPLE_CERTIFICATE=$DEVELOPER_ID_P12"
            echo "APPLE_CERTIFICATE_PASSWORD=$DEVELOPER_ID_P12_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$DEVELOPER_ID_IDENTITY"
            echo "APPLE_API_KEY=$APPLE_ASC_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_ASC_ISSUER_ID"
            echo "APPLE_API_KEY_PATH=$key_path"
          } >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      - run: bun install --frozen-lockfile

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: bunx tauri
          args: ${{ matrix.args }}
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

      # What a downloaded copy will meet: Gatekeeper needs both the Developer ID
      # signature and a stapled notarization ticket.
      - name: Verify signature and notarization
        if: steps.macos-signing.outputs.signed == 'true'
        shell: bash
        run: |
          app="$(find apps/desktop/src-tauri/target -maxdepth 6 -type d -path '*/release/bundle/macos/*.app' | head -n 1)"
          if [[ -z "$app" ]]; then
            echo "No app bundle was built." >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E '^(Authority|TeamIdentifier|flags)='
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"

      - name: Remove signing material
        if: always() && runner.os == 'macOS'
        shell: bash
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8

  publish:
    name: Publish release
    needs: [prepare, build]
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --latest
